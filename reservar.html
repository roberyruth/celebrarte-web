<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Reservar | Celebrarte Málaga</title>
<meta name="description" content="Reserva tu celebración en Celebrarte Málaga: cumpleaños, eventos privados, talleres y fiestas.">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
font-family:Inter,sans-serif;
background:#ffffff;
color:#333;
overflow-x:hidden;
}

/* NAV */
.nav {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    padding: 15px 25px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: rgba(255,255,255,0.85);
    backdrop-filter: blur(10px);
    z-index: 999;
}

.nav a {
    text-decoration: none;
    color: #333;
    font-weight: 700;
    margin-left: 20px;
}

/* HERO */
.hero{
height:60vh;
background:url('video1.mp4');
background-size:cover;
background-position:center;
display:flex;
align-items:center;
justify-content:center;
text-align:center;
color:white;
text-shadow:0 4px 20px rgba(0,0,0,0.6);
padding:20px;
margin-top:80px;
}

.hero h1{
font-size:clamp(42px,7vw,70px);
font-weight:800;
margin-bottom:10px;
}

.hero p{
font-size:clamp(18px,3vw,24px);
}

/* SECCIÓN */
.section{
max-width:900px;
margin:auto;
padding:60px 20px 80px 20px;
}

h2{
font-size:clamp(28px,5vw,42px);
margin-bottom:20px;
font-weight:800;
text-align:center;
}

p{
font-size:18px;
line-height:1.6;
margin-bottom:20px;
text-align:center;
}

/* FORMULARIO */
.form-card{
background:#f7f7f7;
padding:30px;
border-radius:18px;
margin-top:30px;
}

.form-card label{
font-weight:700;
display:block;
margin-bottom:6px;
}

.form-card input,
.form-card select{
width:100%;
padding:12px;
border-radius:10px;
border:1px solid #ccc;
margin-bottom:20px;
font-size:16px;
}

.btn{
padding:15px 28px;
border-radius:40px;
font-weight:700;
text-decoration:none;
display:inline-block;
margin:5px;
text-align:center;
cursor:pointer;
}

.primary{background:#ff4fa3;color:white}
.secondary{border:2px solid #ff4fa3;color:#ff4fa3;background:white}

/* FOOTER */
.footer{
text-align:center;
padding:30px;
background:#333;
color:white;
margin-top:40px;
}

/* WHATSAPP */
.whatsapp {
    position: fixed;
    bottom: 25px;
    right: 25px;
    z-index: 99999;
}

.whatsapp img {
    width: 80px;
    height: 80px;
    filter: drop-shadow(0 4px 10px rgba(0,0,0,0.3));
    transition: 0.2s;
}

.whatsapp img:hover {
    transform: scale(1.1);
}
</style>
</head>

<body>

<!-- NAV -->
<nav class="nav">
    <div>
        <a href="index.html">Inicio</a>
        <a href="reservar.html">Reservar</a>
    </div>
</nav>

<!-- HERO -->
<section class="hero">
    <div>
        <h1>Reserva tu celebración</h1>
        <p>Elige fecha, horario y tipo de evento. Te confirmamos por WhatsApp.</p>
    </div>
</section>

<section class="section">
    <h2>Formulario de reserva</h2>

    <p>Rellena los datos y te responderemos al instante por WhatsApp.</p>

    <div class="form-card">

        <label>Nombre</label>
        <input type="text" id="nombre" placeholder="Tu nombre">

        <label>Tipo de celebración</label>
        <select id="actividad">
            <option value="Cumpleaños infantil">Cumpleaños infantil</option>
            <option value="Cumpleaños adultos">Cumpleaños adultos</option>
            <option value="Baby shower">Baby shower</option>
            <option value="Bautizo">Bautizo</option>
            <option value="Taller / evento privado">Taller / evento privado</option>
            <option value="Otro tipo de celebración">Otro tipo de celebración</option>
        </select>

        <label>Fecha</label>
        <input type="text" id="fecha" placeholder="Selecciona una fecha">

        <label>Hora</label>
        <input type="time" id="hora">

        <label>Número de personas</label>
        <input type="number" id="personas" min="1" value="1">

        <label>Mensaje adicional</label>
        <input type="text" id="mensaje" placeholder="Opcional">

        <button class="btn primary" onclick="enviarWhatsApp()">Enviar por WhatsApp</button>
    </div>
</section>

<footer class="footer">
Celebrarte Málaga © 2026
</footer>

<a class="whatsapp" href="https://wa.me/34610050723" target="_blank">
    <img src="https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg">
</a>

<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>

<script>
flatpickr("#fecha", {
    minDate: "today",
    dateFormat: "d/m/Y"
});

function enviarWhatsApp() {
    const nombre = document.getElementById("nombre").value;
    const actividad = document.getElementById("actividad").value;
    const fecha = document.getElementById("fecha").value;
    const hora = document.getElementById("hora").value;
    const personas = document.getElementById("personas").value;
    const mensaje = document.getElementById("mensaje").value;

    const texto = 
`Hola! Soy ${nombre}.
Quiero reservar en Celebrarte:
Evento: ${actividad}
Fecha: ${fecha}
Hora: ${hora}
Personas: ${personas}
Mensaje: ${mensaje}`;

    const url = "https://wa.me/34610050723?text=" + encodeURIComponent(texto);
    window.open(url, "_blank");
}
</script>

</body>
</html>
